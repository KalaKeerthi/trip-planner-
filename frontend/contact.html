<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Travel Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="logo">Travel Planner</div>
    <ul>
      <li><a href="index.html">Introduction</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="auth.html">Login/Register</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="plan-trip.html">Plan Trip</a></li>
      <li><a href="my-trips.html">My Trips</a></li>
    </ul>
  </nav>
  <section>
    <h2>Contact & Guide Request</h2>
    <form id="contact-form">
      <label for="name">Your Name:</label>
      <input type="text" id="name" required>
      <label for="email">Your Email:</label>
      <input type="email" id="email" required>
      <label for="city">Destination City:</label>
      <input type="text" id="city" required>
      <label for="guide">Preferred Guide:</label>
      <select id="guide">
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="any">Any</option>
      </select>
      <label for="message">Additional Message:</label>
      <textarea id="message" rows="4"></textarea>
      <button type="submit">Submit Request</button>
    </form>
    <div class="contact-details">
      <h3>Contact Details</h3>
      <p>Email: support@travelplanner.com</p>
      <p>Phone: +1-234-567-8900</p>
      <img src="assets/images/contact.jpeg" alt="Contact" style="width:100%;max-width:400px;border-radius:8px;">
    </div>
  </section>
</body>
</html>
