<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plan Trip - Travel Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="logo">
      <img src="assets/images/logo.jpeg" alt="Travel Planner Logo" class="nav-logo">
      Travel Planner
    </div>
    <ul>
      <li><a href="index.html">Introduction</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="auth.html">Login/Register</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="plan-trip.html" class="active">Plan Trip</a></li>
      <li><a href="my-trips.html">My Trips</a></li>
    </ul>
  </nav>

  <section class="trip-planning-section">
    <h2>Plan Your Dream Trip</h2>
    
    <form id="trip-form" class="trip-form">
      <div class="form-group">
        <label for="trip-name">Trip Name:</label>
        <input type="text" id="trip-name" required placeholder="e.g., Paris Adventure 2025">
      </div>

      <div class="form-group">
        <label for="destination">Destination City:</label>
        <input type="text" id="destination" required placeholder="e.g., Paris, London, New York">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="start-date">Start Date:</label>
          <input type="date" id="start-date" required>
        </div>
        <div class="form-group">
          <label for="end-date">End Date:</label>
          <input type="date" id="end-date" required>
        </div>
      </div>

      <div class="form-group">
        <label for="budget">Budget (USD):</label>
        <input type="number" id="budget" min="0" placeholder="e.g., 2000">
      </div>

      <div class="form-group">
        <label for="places">Places to Visit:</label>
        <div id="places-container">
          <div class="place-input">
            <input type="text" class="place-name" placeholder="Place name">
            <input type="text" class="place-address" placeholder="Address (optional)">
            <button type="button" class="remove-place" onclick="removePlace(this)">Remove</button>
          </div>
        </div>
        <button type="button" id="add-place-btn" class="secondary-btn">+ Add Another Place</button>
      </div>

      <div class="form-group">
        <label for="notes">Additional Notes:</label>
        <textarea id="notes" rows="4" placeholder="Any special requirements, preferences, or notes about your trip..."></textarea>
      </div>

      <button type="submit" class="primary-btn">Save Trip Plan</button>
    </form>

    <div id="success-message" class="success-message" style="display: none;">
      <h3>🎉 Trip Saved Successfully!</h3>
      <p>Your trip plan has been saved. You can view and manage it from the "My Trips" page.</p>
      <a href="my-trips.html" class="primary-btn">View My Trips</a>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Travel Planner. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="trip-planner.js"></script>
</body>
</html>
